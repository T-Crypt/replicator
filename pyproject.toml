[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replicator-workshop"
version = "0.1.0"
description = "You specify it, you build it: a sentence becomes a validated build program, an exact solid, a checked report and a printable file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/mcp-for-blender/LICENSE"]
requires-python = ">=3.11"
keywords = ["cad", "3d", "solid-modelling", "manifold", "llm", "mcp", "engineering", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "manifold3d>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "shapely>=2.0",
    "pillow>=10.0",
    "jsonpatch>=1.33",
    "networkx>=3.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
app = ["PySide6>=6.9"]
mcp = ["mcp>=2.0"]
cad = ["cadquery-ocp>=7.7", "cascadio>=0.0.13"]
sim = ["mujoco>=3.0"]
dev = ["pytest>=8", "ezdxf>=1.1"]
all = ["replicator-workshop[app,mcp,cad,sim,dev]"]

[project.scripts]
replicator = "replicator.app:main"
replicator-mcp = "replicator.mcp_server:main"

[project.urls]
Source = "https://github.com/T-Crypt/replicator"
Issues = "https://github.com/T-Crypt/replicator/issues"
Roadmap = "https://github.com/T-Crypt/replicator/blob/main/docs/ROADMAP.md"

[tool.setuptools.packages.find]
include = ["replicator*"]

[tool.setuptools.package-data]
replicator = ["knowledge/*.md", "llm/prompts/*.md", "qml/**/*", "shaders/*", "fixtures/*.json"]
