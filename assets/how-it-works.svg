<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="t d">
<title id="t">How Replicator works</title>
<desc id="d">Five stages: a sentence that specifies the object, a blueprint written by the model you choose, a BuildProgram of ordered operations, the manifold3d kernel that evaluates every step, and the workshop where the steps materialize. Validation errors loop back to the model for repair; edits in plain words become JSON Patches on the program. Four modes share one scene: Build, Dissect, Reverse and Showcase. Image to 3D and mesh import come in; a Blender round trip and STEP, STL, 3MF or GLB export go out. Geometry, checks and exports run on your CPU; the model is any OpenAI-compatible endpoint you name.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#070c13"/></linearGradient>
<style>
  .m{font-family:ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace} .s{font-family:system-ui,-apple-system,'Segoe UI',Inter,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
  .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="1200" height="1000" rx="18" fill="url(#bg)"/>
<rect x=".75" y=".75" width="1198.5" height="998.5" rx="17.5" fill="none" stroke="#243549" stroke-width="1.5"/>
<text x="40" y="52" class="m" font-size="13" letter-spacing="3" fill="#e8b56f">HOW REPLICATOR WORKS</text>
<text x="40" y="84" class="s" font-size="25" font-weight="600" fill="#f0f5fa">A sentence goes in. An editable object comes out, one build step at a time.</text>
<text x="40" y="132" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">THE PIPELINE</text>
<rect x="40" y="150" width="208" height="190" rx="12" fill="#0f1a28" stroke="#7ad4f2" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="40" y="150" width="208" height="4" rx="2" fill="#7ad4f2"/>
<path d="M58,178a5 5 0 0 1 5-5h20a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5h-12l-7 6v-6h-1a5 5 0 0 1-5-5z" fill="none" stroke="#7ad4f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="194" class="s" font-size="16" font-weight="700" fill="#f0f5fa">1 · Specify</text>
<text x="58" y="236" class="s" font-size="13.5" fill="#c9d6e3">A sentence, a sketch</text>
<text x="58" y="256" class="s" font-size="13.5" fill="#c9d6e3">of an idea, or an edit</text>
<rect x="54" y="278" width="180" height="48" rx="7" fill="#081220" stroke="#243549"/>
<text x="66" y="298" class="m" font-size="12" fill="#7ad4f2">"a turbofan with</text>
<text x="66" y="317" class="m" font-size="12" fill="#7ad4f2">reverse doors"</text>
<path class="flow" d="M249,245 h13" stroke="#7ad4f2" stroke-width="2"/>
<rect x="263" y="150" width="208" height="190" rx="12" fill="#0f1a28" stroke="#9aa8ff" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="263" y="150" width="208" height="4" rx="2" fill="#9aa8ff"/>
<rect x="281" y="172" width="28" height="30" rx="3" fill="none" stroke="#9aa8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M287,180h16M287,187h16M287,194h10" fill="none" stroke="#9aa8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="325" y="194" class="s" font-size="16" font-weight="700" fill="#f0f5fa">2 · Blueprint</text>
<text x="281" y="236" class="s" font-size="13.5" fill="#c9d6e3">Your model plans parts,</text>
<text x="281" y="256" class="s" font-size="13.5" fill="#c9d6e3">sizes, materials</text>
<rect x="277" y="278" width="180" height="48" rx="7" fill="#081220" stroke="#243549"/>
<text x="289" y="298" class="m" font-size="12" fill="#9aa8ff">parts: 14</text>
<text x="289" y="317" class="m" font-size="12" fill="#9aa8ff">units: mm</text>
<path class="flow" d="M472,245 h13" stroke="#7ad4f2" stroke-width="2"/>
<rect x="486" y="150" width="208" height="190" rx="12" fill="#0f1a28" stroke="#c4a1ff" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="486" y="150" width="208" height="4" rx="2" fill="#c4a1ff"/>
<path d="M512,177l-8,10l8,10M526,177l8,10l-8,10M522,174l-6,26" fill="none" stroke="#c4a1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="548" y="194" class="s" font-size="16" font-weight="700" fill="#f0f5fa">3 · BuildProgram</text>
<text x="504" y="236" class="s" font-size="13.5" fill="#c9d6e3">Ordered ops, each tagged</text>
<text x="504" y="256" class="s" font-size="13.5" fill="#c9d6e3">with its component</text>
<rect x="500" y="278" width="180" height="48" rx="7" fill="#081220" stroke="#243549"/>
<text x="512" y="298" class="m" font-size="12" fill="#c4a1ff">revolve · array</text>
<text x="512" y="317" class="m" font-size="12" fill="#c4a1ff">boolean · loft</text>
<path class="flow" d="M695,245 h13" stroke="#7ad4f2" stroke-width="2"/>
<rect x="709" y="150" width="208" height="190" rx="12" fill="#0f1a28" stroke="#7ee8ac" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="709" y="150" width="208" height="4" rx="2" fill="#7ee8ac"/>
<path d="M742,172l14,7v16l-14,7l-14-7v-16z M728,179l14,7l14-7 M742,186v16" fill="none" stroke="#7ee8ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="771" y="194" class="s" font-size="16" font-weight="700" fill="#f0f5fa">4 · Kernel</text>
<text x="727" y="236" class="s" font-size="13.5" fill="#c9d6e3">manifold3d evaluates</text>
<text x="727" y="256" class="s" font-size="13.5" fill="#c9d6e3">every step, cached</text>
<rect x="723" y="278" width="180" height="48" rx="7" fill="#081220" stroke="#243549"/>
<text x="735" y="298" class="m" font-size="12" fill="#7ee8ac">10-60 ms</text>
<text x="735" y="317" class="m" font-size="12" fill="#7ee8ac">watertight</text>
<path class="flow" d="M918,245 h13" stroke="#7ad4f2" stroke-width="2"/>
<rect x="932" y="150" width="208" height="190" rx="12" fill="#0f1a28" stroke="#e8b56f" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="932" y="150" width="208" height="4" rx="2" fill="#e8b56f"/>
<path d="M950,186c8-12 24-12 32,0c-8,12-24,12-32,0z" fill="none" stroke="#e8b56f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="966" cy="186" r="5" fill="none" stroke="#e8b56f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="994" y="194" class="s" font-size="16" font-weight="700" fill="#f0f5fa">5 · Workshop</text>
<text x="950" y="236" class="s" font-size="13.5" fill="#c9d6e3">Steps materialize on</text>
<text x="950" y="256" class="s" font-size="13.5" fill="#c9d6e3">the floor, Qt Quick 3D</text>
<rect x="946" y="278" width="180" height="48" rx="7" fill="#081220" stroke="#243549"/>
<text x="958" y="298" class="m" font-size="12" fill="#e8b56f">scrub · edit</text>
<text x="958" y="317" class="m" font-size="12" fill="#e8b56f">Qt Quick 3D</text>
<path class="flow" d="M813.0,342 v24 H600.0 v-22" fill="none" stroke="#fb7185" stroke-width="1.8"/>
<path d="M595.0,350 l5,-7 l5,7" fill="none" stroke="#fb7185" stroke-width="1.8"/>
<text x="701.5" y="384" text-anchor="middle" class="m" font-size="11.5" fill="#fb7185">validation errors go back to the model: repair rounds</text>
<path class="flow" d="M1036.0,148 v-10 H580.0 v8" fill="none" stroke="#e8b56f" stroke-width="1.8"/>
<path d="M575.0,141 l5,7 l5,-7" fill="none" stroke="#e8b56f" stroke-width="1.8"/>
<text x="853.0" y="132" text-anchor="middle" class="m" font-size="11.5" fill="#e8b56f">"make the doors wider" becomes a JSON Patch on the program, saved as a new version</text>
<text x="40" y="412" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">FOUR MODES, ONE SCENE</text>
<rect x="40.0" y="430" width="266" height="132" rx="12" fill="#111b28" stroke="#243549"/>
<rect x="40.0" y="430" width="4" height="132" rx="2" fill="#3a8ee6"/>
<text x="60.0" y="462" class="s" font-size="17" font-weight="700" fill="#3a8ee6">Build</text>
<rect x="262.0" y="446" width="22" height="22" rx="5" fill="none" stroke="#8ba0b8" stroke-opacity=".6"/><text x="273.0" y="462" text-anchor="middle" class="m" font-size="11" fill="#8ba0b8">1</text>
<text x="60.0" y="492" class="s" font-size="13.5" fill="#c9d6e3">Play, pause and scrub the build.</text>
<text x="60.0" y="512" class="s" font-size="13.5" fill="#c9d6e3">Select any step, edit its params</text>
<text x="60.0" y="532" class="s" font-size="13.5" fill="#c9d6e3">or its placement, and rebuild.</text>
<rect x="318.6" y="430" width="266" height="132" rx="12" fill="#111b28" stroke="#243549"/>
<rect x="318.6" y="430" width="4" height="132" rx="2" fill="#e06b7b"/>
<text x="338.6" y="462" class="s" font-size="17" font-weight="700" fill="#e06b7b">Dissect</text>
<rect x="540.6" y="446" width="22" height="22" rx="5" fill="none" stroke="#8ba0b8" stroke-opacity=".6"/><text x="551.6" y="462" text-anchor="middle" class="m" font-size="11" fill="#8ba0b8">2</text>
<text x="338.6" y="492" class="s" font-size="13.5" fill="#c9d6e3">Exploded view along each part's</text>
<text x="338.6" y="512" class="s" font-size="13.5" fill="#c9d6e3">own axis, with callouts that</text>
<text x="338.6" y="532" class="s" font-size="13.5" fill="#c9d6e3">follow the parts.</text>
<rect x="597.2" y="430" width="266" height="132" rx="12" fill="#111b28" stroke="#243549"/>
<rect x="597.2" y="430" width="4" height="132" rx="2" fill="#7ee8ac"/>
<text x="617.2" y="462" class="s" font-size="17" font-weight="700" fill="#7ee8ac">Reverse</text>
<rect x="819.2" y="446" width="22" height="22" rx="5" fill="none" stroke="#8ba0b8" stroke-opacity=".6"/><text x="830.2" y="462" text-anchor="middle" class="m" font-size="11" fill="#8ba0b8">3</text>
<text x="617.2" y="492" class="s" font-size="13.5" fill="#c9d6e3">Import any mesh. Pieces, repeats,</text>
<text x="617.2" y="512" class="s" font-size="13.5" fill="#c9d6e3">contacts and assembly order, each</text>
<text x="617.2" y="532" class="s" font-size="13.5" fill="#c9d6e3">marked observed or inferred.</text>
<rect x="875.8000000000001" y="430" width="266" height="132" rx="12" fill="#111b28" stroke="#243549"/>
<rect x="875.8000000000001" y="430" width="4" height="132" rx="2" fill="#e8b56f"/>
<text x="895.8000000000001" y="462" class="s" font-size="17" font-weight="700" fill="#e8b56f">Showcase</text>
<rect x="1097.8000000000002" y="446" width="22" height="22" rx="5" fill="none" stroke="#8ba0b8" stroke-opacity=".6"/><text x="1108.8000000000002" y="462" text-anchor="middle" class="m" font-size="11" fill="#8ba0b8">4</text>
<text x="895.8000000000001" y="492" class="s" font-size="13.5" fill="#c9d6e3">Stage, turntable, depth of field.</text>
<text x="895.8000000000001" y="512" class="s" font-size="13.5" fill="#c9d6e3">Render a Cycles still on the CPU</text>
<text x="895.8000000000001" y="532" class="s" font-size="13.5" fill="#c9d6e3">in seconds.</text>
<text x="40" y="602" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">IN AND OUT</text>
<rect x="40" y="620" width="520" height="72" rx="10" fill="#0f1a28" stroke="#243549"/>
<rect x="58" y="642" width="30" height="24" rx="4" fill="none" stroke="#c4a1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M62,662l7-8l6,6l4-4l8,6" fill="none" stroke="#c4a1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="649" r="2.5" fill="none" stroke="#c4a1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106" y="648" class="s" font-size="15" font-weight="700" fill="#f0f5fa">Image to 3D</text>
<text x="106" y="669" class="s" font-size="13" fill="#c9d6e3">a character sheet or any picture</text>
<text x="106" y="685" class="s" font-size="13" fill="#8ba0b8">becomes a mesh in your ComfyUI</text>
<rect x="40" y="704" width="520" height="72" rx="10" fill="#0f1a28" stroke="#243549"/>
<path d="M73,724l14,7v16l-14,7l-14-7v-16z M59,731l14,7l14-7 M73,738v16" fill="none" stroke="#7ee8ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106" y="732" class="s" font-size="15" font-weight="700" fill="#f0f5fa">Mesh import</text>
<text x="106" y="753" class="s" font-size="13" fill="#c9d6e3">GLB, STEP, OBJ, STL and 20 more formats</text>
<text x="106" y="769" class="s" font-size="13" fill="#8ba0b8">open in Reverse and are taken apart</text>
<rect x="640" y="620" width="520" height="72" rx="10" fill="#0f1a28" stroke="#243549"/>
<path d="M673,640l14,7v16l-14,7l-14-7v-16z M659,647l14,7l14-7 M673,654v16" fill="none" stroke="#e8b56f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="706" y="648" class="s" font-size="15" font-weight="700" fill="#f0f5fa">Blender round trip</text>
<text x="706" y="669" class="s" font-size="13" fill="#c9d6e3">Open in Blender, sculpt or texture,</text>
<text x="706" y="685" class="s" font-size="13" fill="#8ba0b8">Pull back into Reverse (localhost:9876)</text>
<rect x="640" y="704" width="520" height="72" rx="10" fill="#0f1a28" stroke="#243549"/>
<rect x="658" y="724" width="28" height="30" rx="3" fill="none" stroke="#7ad4f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M664,732h16M664,739h16M664,746h10" fill="none" stroke="#7ad4f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="706" y="732" class="s" font-size="15" font-weight="700" fill="#f0f5fa">Export</text>
<text x="706" y="753" class="s" font-size="13" fill="#c9d6e3">STEP for CAD, GLB for the web,</text>
<text x="706" y="769" class="s" font-size="13" fill="#8ba0b8">STL and 3MF when you print</text>
<circle cx="600" cy="698" r="30" fill="#0b1420" stroke="#7ad4f2" stroke-width="1.5" class="pulse"/>
<text x="600" y="703" text-anchor="middle" class="m" font-size="11" fill="#7ad4f2">scene</text>
<path class="flow" d="M561,656 C580,656 575,698 570,698" fill="none" stroke="#7ad4f2" stroke-width="1.6"/>
<path class="flow" d="M630,698 C625,698 620,656 639,656" fill="none" stroke="#7ad4f2" stroke-width="1.6"/>
<path class="flow" d="M561,740 C580,740 575,698 570,698" fill="none" stroke="#7ad4f2" stroke-width="1.6"/>
<path class="flow" d="M630,698 C625,698 620,740 639,740" fill="none" stroke="#7ad4f2" stroke-width="1.6"/>
<text x="40" y="812" class="m" font-size="12.5" letter-spacing="2.5" fill="#8ba0b8">WHERE THE WORK RUNS</text>
<rect x="40" y="830" width="1120" height="128" rx="12" fill="#0f1a28" stroke="#243549"/>
<rect x="64" y="854" width="500" height="80" rx="9" fill="#0b1420" stroke="#7ee8ac" stroke-opacity=".6"/>
<text x="84" y="882" class="m" font-size="14" font-weight="700" fill="#7ee8ac">Your machine</text>
<text x="84" y="904" class="s" font-size="13.5" fill="#c9d6e3">Kernel, checks, mass, drawings and exports on the CPU.</text>
<text x="84" y="923" class="s" font-size="12.5" fill="#8ba0b8">The window on any GPU; the iGPU when a model needs the big card.</text>
<rect x="596" y="854" width="540" height="80" rx="9" fill="#0b1420" stroke="#e8b56f" stroke-opacity=".6"/>
<text x="616" y="882" class="m" font-size="14" font-weight="700" fill="#e8b56f">Your model</text>
<text x="616" y="904" class="s" font-size="13.5" fill="#c9d6e3">Any OpenAI-compatible endpoint: llama.cpp, Ollama, vLLM, hosted.</text>
<text x="616" y="923" class="s" font-size="12.5" fill="#8ba0b8">Only the endpoints you name; keys stay in the environment.</text>
</svg>
