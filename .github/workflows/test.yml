name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        extras: ["all", "dev"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        if: matrix.extras == 'all'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check every fixture builds
        run: |
          for f in replicator/fixtures/*.json; do
            python -m tools.check "$f" > /dev/null || { echo "FAIL $f"; exit 1; }
          done

  package:
    # the installed wheel, not the checkout: the window's QML, shaders and examples must ship inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip wheel --no-deps -w dist .
      - run: python -m venv /tmp/env && /tmp/env/bin/pip install "$(ls dist/*.whl)[mcp]"
      - name: The installed package carries its assets and builds an example
        working-directory: /tmp
        run: |
          /tmp/env/bin/python - <<'PY'
          from replicator import FIXTURES, QML
          from replicator import mcp_server as M
          assert (QML / "Main.qml").exists() and (QML / "Replicator" / "UI" / "qmldir").exists(), QML
          assert (QML.parent / "shaders" / "grid.frag").exists()
          examples = sorted(FIXTURES.glob("*.json"))
          assert len(examples) >= 9, examples
          r = M.build_report(str(FIXTURES / "rocket_engine.json"))
          assert r["ok"] and r["report"]["parts"] == 19, r
          print("installed package OK:", len(examples), "examples")
          PY
